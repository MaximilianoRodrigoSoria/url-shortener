apiVersion: v1
kind: Service
metadata:
  name: url-shortener-service
  namespace: url-shortener
  labels:
    app.kubernetes.io/name: url-shortener
spec:
  type: ClusterIP        # El Ingress (ingress.yaml) enruta el tráfico externo al Service
  selector:
    app: url-shortener
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
